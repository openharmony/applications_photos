<?xml version="1.0" encoding="UTF-8"?>
<!-- Repo-oriented architecture diagram for applications_photos. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font: bold 22px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #0f172a; }
      .layerTitle { font: bold 16px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #1e293b; }
      .layerDesc { font: 12px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #334155; }
      .cardText { font: 12px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #334155; }
      .small { font: 11px 'Microsoft YaHei','PingFang SC',sans-serif; fill: #475569; }

      .entryBg { fill: #d9eef9; stroke: #7cc3e8; stroke-width: 2; }
      .featureBg { fill: #dbe7ff; stroke: #94b3ff; stroke-width: 2; }
      .sharedBg { fill: #fde7bf; stroke: #f3bf63; stroke-width: 2; }
      .fwBg { fill: #d9ddff; stroke: #9aa8ff; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #d7deea; stroke-width: 1; }
      .mutedCard { fill: #f8fafc; stroke: #d7deea; stroke-width: 1; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    ]]></style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="42" class="title">Gallery Application Architecture</text>

  <!-- entry -->
  <rect x="60" y="80" width="1040" height="132" rx="10" class="entryBg"/>
  <text x="84" y="108" class="layerTitle">entry orchestration layer</text>
  <text x="84" y="128" class="layerDesc">`product/phone`: Abilities, page composition, routing, permission declarations, module integration</text>

  <rect x="90" y="150" width="152" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="166" y="174" text-anchor="middle" class="cardText">MainAbility / Application</text>
  <rect x="258" y="150" width="128" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="322" y="174" text-anchor="middle" class="cardText">page composition</text>
  <rect x="402" y="150" width="116" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="460" y="174" text-anchor="middle" class="cardText">pickerability</text>
  <rect x="534" y="150" width="116" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="592" y="174" text-anchor="middle" class="cardText">FormAbility</text>
  <rect x="666" y="150" width="132" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="732" y="174" text-anchor="middle" class="cardText">ext. Ability / UIExt</text>
  <rect x="814" y="150" width="126" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="877" y="174" text-anchor="middle" class="cardText">viewmodel</text>
  <rect x="956" y="150" width="112" height="38" rx="6" class="mutedCard" filter="url(#shadow)"/>
  <text x="1012" y="174" text-anchor="middle" class="cardText">...</text>

  <!-- feature -->
  <rect x="60" y="250" width="1040" height="138" rx="10" class="featureBg"/>
  <text x="84" y="278" class="layerTitle">feature business modules</text>
  <text x="84" y="298" class="layerDesc">`feature/*`: albums, timeline, browsing, photo picking, privacy, cards, and other domain modules</text>

  <rect x="90" y="320" width="118" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="149" y="344" text-anchor="middle" class="cardText">timeline</text>
  <rect x="222" y="320" width="118" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="281" y="344" text-anchor="middle" class="cardText">browser</text>
  <rect x="354" y="320" width="136" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="422" y="344" text-anchor="middle" class="cardText">browserlibrary</text>
  <rect x="504" y="320" width="128" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="568" y="344" text-anchor="middle" class="cardText">dataProvider</text>
  <rect x="646" y="320" width="118" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="705" y="344" text-anchor="middle" class="cardText">thirdselect</text>
  <rect x="778" y="320" width="118" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="837" y="344" text-anchor="middle" class="cardText">privacy</text>
  <rect x="910" y="320" width="92" height="38" rx="6" class="card" filter="url(#shadow)"/>
  <text x="956" y="344" text-anchor="middle" class="cardText">faCard</text>
  <rect x="1016" y="320" width="52" height="38" rx="6" class="mutedCard" filter="url(#shadow)"/>
  <text x="1042" y="344" text-anchor="middle" class="cardText">...</text>

  <!-- shared -->
  <rect x="60" y="426" width="1040" height="124" rx="10" class="sharedBg"/>
  <text x="84" y="454" class="layerTitle">shared / cross-cutting modules</text>
  <text x="84" y="474" class="layerDesc">`common`, `browserCommon`, `browserCommonPhone`, `tools`, `imageEditor`: reused by entry and feature modules</text>

  <rect x="90" y="496" width="170" height="34" rx="6" class="card" filter="url(#shadow)"/>
  <text x="175" y="518" text-anchor="middle" class="small">common: model / view / VM</text>
  <rect x="276" y="496" width="114" height="34" rx="6" class="card" filter="url(#shadow)"/>
  <text x="333" y="518" text-anchor="middle" class="cardText">permission</text>
  <rect x="406" y="496" width="114" height="34" rx="6" class="card" filter="url(#shadow)"/>
  <text x="463" y="518" text-anchor="middle" class="cardText">task / utils</text>
  <rect x="536" y="496" width="160" height="34" rx="6" class="card" filter="url(#shadow)"/>
  <text x="616" y="518" text-anchor="middle" class="cardText">browserCommon / Phone</text>
  <rect x="712" y="496" width="90" height="34" rx="6" class="card" filter="url(#shadow)"/>
  <text x="757" y="518" text-anchor="middle" class="cardText">tools</text>
  <rect x="818" y="496" width="168" height="34" rx="6" class="card" filter="url(#shadow)"/>
  <text x="902" y="518" text-anchor="middle" class="small">imageEditor: common / phone</text>
  <rect x="1002" y="496" width="66" height="34" rx="6" class="mutedCard" filter="url(#shadow)"/>
  <text x="1035" y="518" text-anchor="middle" class="cardText">...</text>

  <!-- framework -->
  <rect x="60" y="586" width="1040" height="40" rx="10" class="fwBg"/>
  <text x="84" y="612" class="layerTitle">OpenHarmony Framework</text>
  <text x="340" y="612" class="small">ArkUI &#x00B7; Ability &#x00B7; BundleManager &#x00B7; DataShare &#x00B7; MediaLibrary &#x00B7; Notification &#x00B7; DFX &#x00B7; ...</text>

  <!-- arrows -->
  <path d="M580 212 L580 240" class="arrow"/>
  <path d="M580 388 L580 416" class="arrow"/>
  <path d="M580 550 L580 578" class="arrow"/>
</svg>
